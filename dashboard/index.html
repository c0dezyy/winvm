<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>RCloud Controller</title>
<style>
  :root{ --bg:#0a0f1e; --bg2:#10183a; --card:#121a33; --card2:#18224a; --text:#eaf0ff; --muted:#8e9bc0;
    --line:#26325e; --accent:#5b8cff; --accent2:#8a5cff; --ok:#2ecc8f; --warn:#ffb020; --bad:#ff5c7a; }
  @media (prefers-color-scheme: light){ :root{ --bg:#eef2fb; --bg2:#dfe7ff; --card:#fff; --card2:#f3f6ff;
    --text:#10173a; --muted:#5b6890; --line:#dbe3f6; } }
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1200px 600px at 20% -10%,var(--bg2),var(--bg)) fixed;padding:16px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin:0} .muted{color:var(--muted)} .hidden{display:none !important}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  input,select{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:14px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);padding:8px 13px}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;font-weight:600}
  button.danger{border-color:rgba(255,92,122,.5);color:var(--bad)} button:hover{filter:brightness(1.1)}
  .login{max-width:360px;margin:15vh auto} .login input{width:100%;margin:8px 0}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-size:19px} .stat span{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .dot.ok{background:var(--ok)} .dot.off{background:var(--muted)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .row-btns{display:flex;gap:6px;flex-wrap:wrap} .small{padding:5px 9px;font-size:12px;border-radius:8px}
  .badge{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--line)}
  .err{color:var(--bad);font-size:13px;min-height:16px}
  .overlay{position:fixed;inset:0;background:rgba(3,6,18,.6);display:grid;place-items:center;padding:16px;z-index:10}
  .modal{width:100%;max-width:380px} .modal input{width:100%;margin:8px 0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--text);
    color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;transition:.2s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<main id="login" class="wrap login">
  <div class="card">
    <h1>RCloud Controller</h1>
    <p class="muted">Sign in to manage connected devices</p>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="primary" style="width:100%;margin-top:6px" id="loginBtn">Sign in</button>
  </div>
</main>

<main id="dash" class="wrap hidden">
  <div class="top">
    <h1>RCloud Controller</h1>
    <div class="row-btns">
      <button class="small" id="tokensBtn">Tokens</button>
      <button class="small" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div class="card">
    <div class="grid" id="totals"></div>
  </div>

  <div class="card">
    <div class="top" style="margin-bottom:8px"><b>Devices</b><span class="muted" id="deviceCount"></span></div>
    <table><thead><tr><th>Status</th><th>Name</th><th>CPU</th><th>RAM</th><th>GPU</th><th>Mode</th><th></th></tr></thead>
    <tbody id="workers"></tbody></table>
    <p class="muted hidden" id="noWorkers">No devices yet. Create an enroll token, then run on a laptop:
      <code>rcloud-worker --enroll SERVER TOKEN --install-startup</code></p>
  </div>

  <div class="card">
    <div class="top" style="margin-bottom:8px"><b>Recent jobs</b></div>
    <table><thead><tr><th>Job</th><th>Type</th><th>State</th><th>Device</th><th>When</th><th></th></tr></thead>
    <tbody id="jobs"></tbody></table>
  </div>
</main>

<div id="overlay" class="overlay hidden"><div class="card modal" id="modal"></div></div>
<div id="toast" class="toast"></div>

<script>
"use strict";
const $=(id)=>document.getElementById(id);
const LS="rcloud_admin_token";
let token=sessionStorage.getItem(LS);
let timer=null;

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1600);}
async function api(method,path,body){
  const r=await fetch(path,{method,headers:Object.assign({"Content-Type":"application/json"},token?{Authorization:"Bearer "+token}:{}),
    body:body?JSON.stringify(body):undefined});
  let data=null; try{data=await r.json();}catch{}
  if(!r.ok) throw new Error((data&&data.error)||("HTTP "+r.status));
  return data;
}

$("loginBtn").onclick=async()=>{
  const err=$("loginErr"); err.textContent="";
  try{ const r=await api("POST","/api/admin/login",{password:$("pw").value}); token=r.token;
    sessionStorage.setItem(LS,token); showDash(); }
  catch(e){ err.textContent=e.message; }
};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click();});
$("logoutBtn").onclick=async()=>{ try{await api("POST","/api/admin/logout");}catch{} sessionStorage.removeItem(LS); token=null;
  clearInterval(timer); $("dash").classList.add("hidden"); $("login").classList.remove("hidden"); };

function showDash(){ $("login").classList.add("hidden"); $("dash").classList.remove("hidden"); refresh(); timer=setInterval(refresh,4000); }

function ago(sec){ sec=Math.max(0,Math.round(sec));
  if(sec<60) return sec+"s ago"; if(sec<3600) return Math.floor(sec/60)+"m ago";
  if(sec<86400) return Math.floor(sec/3600)+"h ago"; return Math.floor(sec/86400)+"d ago"; }
function statusDot(s){ return {available:"ok",busy:"ok",offline:"off",paused:"warn",terminating:"bad"}[s]||"off"; }

function row(w,serverNow){
  const since = w.status==="offline" ? (w.offline_since?ago(serverNow-w.offline_since):"-")
    : (w.online_since?ago(serverNow-w.online_since):"-");
  const label = w.status==="offline" ? ("offline, last seen "+since) : (w.status+" "+since);
  const cpu = w.caps.cpu ? w.caps.cpu.logical+" threads" : "-";
  const ramFree = w.stats.ram ? Math.round(w.stats.ram.available_mb/1024*10)/10 : "?";
  const ramTotal = w.caps.ram ? Math.round(w.caps.ram.total_mb/1024*10)/10 : "?";
  const gpus = (w.stats.gpus||w.caps.gpus||[]);
  const gpuText = gpus.length ? gpus.map(g=>g.name+(g.util_pct!=null?" ("+g.util_pct+"%)":"")).join(", ") : "none";
  const disabled = w.status==="offline" || w.status==="terminating";
  return `<tr>
    <td><span class="dot ${statusDot(w.status)}"></span>${label}</td>
    <td><b>${escapeHtml(w.name)}</b><div class="muted" style="font-size:12px">${escapeHtml(w.hostname||"")}</div></td>
    <td>${cpu}${w.running&&w.running.length?` <span class="badge">${w.running.length} job(s)</span>`:""}</td>
    <td>${ramFree} / ${ramTotal} GB free</td>
    <td>${escapeHtml(gpuText)}</td>
    <td>
      <select data-id="${w.id}" class="modeSel small" ${disabled?"disabled":""}>
        ${["gaming","balanced","performance"].map(m=>`<option value="${m}" ${w.mode===m?"selected":""}>${m}</option>`).join("")}
      </select>
    </td>
    <td><div class="row-btns">
      <button class="small" data-act="rename" data-id="${w.id}" data-name="${escapeAttr(w.name)}">Rename</button>
      ${w.status==="terminating"?'<span class="badge">removing...</span>':
        `<button class="small danger" data-act="terminate" data-id="${w.id}" data-name="${escapeAttr(w.name)}">Terminate</button>`}
    </div></td>
  </tr>`;
}
function jobRow(j){
  const colors={succeeded:"ok",failed:"bad",running:"warn",queued:"off",staged:"off",cancelled:"off"};
  return `<tr><td>${j.id}</td><td>${j.type}</td>
    <td><span class="dot ${colors[j.state]||'off'}"></span>${j.state}</td>
    <td>${j.worker_id||"-"}</td><td>${new Date(j.created*1000).toLocaleString()}</td>
    <td>${(j.state==="queued"||j.state==="running")?`<button class="small danger" data-cancel="${j.id}">Cancel</button>`:""}</td></tr>`;
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s).replace(/"/g,"&quot;");}

async function refresh(){
  try{
    const s=await api("GET","/api/admin/state");
    const t=s.totals;
    $("totals").innerHTML=`
      <div class="stat"><b>${t.online}/${t.devices}</b><span>devices online</span></div>
      <div class="stat"><b>${t.threads}</b><span>CPU threads shared</span></div>
      <div class="stat"><b>${Math.round(t.ram_free_mb/1024*10)/10} / ${Math.round(t.ram_total_mb/1024*10)/10} GB</b><span>RAM free/total</span></div>
      <div class="stat"><b>${t.gpus}</b><span>GPUs (${Math.round(t.vram_total_mb/1024*10)/10} GB VRAM)</span></div>
      <div class="stat"><b>${t.disk_free_gb} GB</b><span>storage free</span></div>
      <div class="stat"><b>${s.job_counts.running||0}</b><span>jobs running</span></div>`;
    $("workers").innerHTML=s.workers.map(w=>row(w,s.server_time)).join("");
    $("noWorkers").classList.toggle("hidden", s.workers.length>0);
    $("deviceCount").textContent=" "+s.workers.length;
    $("jobs").innerHTML=s.jobs.map(jobRow).join("") || '<tr><td colspan="6" class="muted">No jobs yet</td></tr>';
    document.querySelectorAll(".modeSel").forEach(el=>el.onchange=()=>act(el.dataset.id,"mode",{mode:el.value}));
    document.querySelectorAll('[data-act="rename"]').forEach(el=>el.onclick=()=>renameFlow(el.dataset.id,el.dataset.name));
    document.querySelectorAll('[data-act="terminate"]').forEach(el=>el.onclick=()=>terminateFlow(el.dataset.id,el.dataset.name));
    document.querySelectorAll('[data-cancel]').forEach(el=>el.onclick=()=>api("POST",`/api/admin/jobs/${el.dataset.cancel}/cancel`).then(refresh));
  }catch(e){
    if(String(e.message).includes("expired")||String(e.message).includes("token")){ $("logoutBtn").onclick(); }
  }
}

function openModal(html){ $("modal").innerHTML=html; $("overlay").classList.remove("hidden"); }
function closeModal(){ $("overlay").classList.add("hidden"); $("modal").innerHTML=""; }
$("overlay").addEventListener("mousedown",e=>{ if(e.target.id==="overlay") closeModal(); });

async function act(id,action,body){ try{ await api("POST",`/api/admin/workers/${id}/${action}`,body||{}); toast("Done"); refresh(); }
  catch(e){ toast(e.message); } }

function renameFlow(id,name){
  openModal(`<h3 style="margin-top:0">Rename device</h3>
    <input id="newName" value="${escapeAttr(name)}">
    <div class="err" id="mErr"></div>
    <div class="row-btns" style="margin-top:10px;justify-content:flex-end">
      <button id="mCancel">Cancel</button><button class="primary" id="mSave">Save</button></div>`);
  $("mCancel").onclick=closeModal;
  $("mSave").onclick=async()=>{ try{ await api("POST",`/api/admin/workers/${id}/rename`,{name:$("newName").value}); closeModal(); toast("Renamed"); refresh(); }
    catch(e){ $("mErr").textContent=e.message; } };
}
function terminateFlow(id,name){
  openModal(`<h3 style="margin-top:0" class="err" style="color:var(--bad)">Terminate ${escapeHtml(name)}</h3>
    <p class="muted">This removes RCloud from that device: it stops sharing, deletes its local settings, and the
    program removes itself. Running jobs on it are re-queued to another device.</p>
    <p>Type <b>${escapeHtml(name)}</b> to confirm:</p>
    <input id="confirmName" placeholder="${escapeAttr(name)}">
    <div class="err" id="mErr"></div>
    <div class="row-btns" style="margin-top:10px;justify-content:flex-end">
      <button id="mCancel">Cancel</button><button class="danger" id="mGo">Terminate</button></div>`);
  $("mCancel").onclick=closeModal;
  $("mGo").onclick=async()=>{ try{ await api("POST",`/api/admin/workers/${id}/terminate`,{confirm:$("confirmName").value}); closeModal(); toast("Terminating..."); refresh(); }
    catch(e){ $("mErr").textContent=e.message; } };
}

$("tokensBtn").onclick=async()=>{
  let list=[]; try{ list=(await api("GET","/api/admin/tokens")).tokens; }catch(e){ toast(e.message); }
  const rows=list.map(t=>`<tr><td>${t.kind}</td><td>${escapeHtml(t.name)}</td><td>${t.uses}${t.max_uses?"/"+t.max_uses:""}</td>
    <td>${t.revoked?"revoked":(t.expires?new Date(t.expires*1000).toLocaleString():"no expiry")}</td>
    <td>${t.revoked?"":`<button class="small danger" data-rev="${t.id}">Revoke</button>`}</td></tr>`).join("");
  openModal(`<h3 style="margin-top:0">Tokens</h3>
    <table><thead><tr><th>Kind</th><th>Name</th><th>Uses</th><th>Expires</th><th></th></tr></thead>
    <tbody id="tokRows">${rows||'<tr><td colspan="5" class="muted">None yet</td></tr>'}</tbody></table>
    <hr style="border-color:var(--line);margin:14px 0">
    <h4 style="margin:0 0 6px">New token</h4>
    <select id="tKind"><option value="enroll">enroll (register a laptop)</option><option value="client">client (submit jobs, e.g. from a workflow)</option></select>
    <input id="tName" placeholder="name, e.g. 'my-laptop' or 'ci'">
    <input id="tHours" type="number" placeholder="expires in hours (blank = enroll default 24h, client = never)">
    <input id="tUses" type="number" placeholder="max uses (enroll tokens only, default 1)">
    <div class="err" id="mErr"></div>
    <div id="newTok" class="hidden" style="word-break:break-all;background:var(--card2);padding:10px;border-radius:8px;margin-top:8px"></div>
    <div class="row-btns" style="margin-top:10px;justify-content:flex-end">
      <button id="mClose">Close</button><button class="primary" id="mCreate">Create</button></div>`);
  document.querySelectorAll("[data-rev]").forEach(el=>el.onclick=async()=>{ await api("DELETE",`/api/admin/tokens/${el.dataset.rev}`); $("tokensBtn").onclick(); });
  $("mClose").onclick=closeModal;
  $("mCreate").onclick=async()=>{
    try{
      const r=await api("POST","/api/admin/tokens",{kind:$("tKind").value,name:$("tName").value,
        hours:$("tHours").value?Number($("tHours").value):undefined, uses:$("tUses").value?Number($("tUses").value):undefined});
      $("newTok").classList.remove("hidden");
      $("newTok").innerHTML = r.id + " &rarr; <b>" + escapeHtml(r.token) + "</b><br><span class='muted'>shown once, copy it now</span>";
    }catch(e){ $("mErr").textContent=e.message; }
  };
};

if(token) showDash();
</script>
</body>
</html>
