name: Build RCloud Worker EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "rcloud/**"
      - "packaging/**"
      - ".github/workflows/build-worker-exe.yml"

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-tray.txt pyinstaller
      - name: Build
        run: pyinstaller packaging/rcloud-worker.spec
      - uses: actions/upload-artifact@v4
        with:
          name: rcloud-worker-windows
          path: dist/rcloud-worker.exe
