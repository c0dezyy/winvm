name: Example - run a job on the laptop cloud

on: workflow_dispatch

jobs:
  run-on-laptop:
    runs-on: ubuntu-latest   # a normal, temporary GitHub-hosted VM
    steps:
      - uses: actions/checkout@v4
      - name: Submit the job to rcloud and wait for the result
        env:
          RCLOUD_SERVER: ${{ secrets.RCLOUD_SERVER }}   # e.g. https://your-controller:8443
          RCLOUD_TOKEN: ${{ secrets.RCLOUD_TOKEN }}     # a client token from: rcloud-controller create-token client ci
        run: |
          python rcloud_actions/rcloud_submit.py \
            --server "$RCLOUD_SERVER" --token "$RCLOUD_TOKEN" \
            --type python --entry main.py --input ./examples/payload --output ./result --cores 2 --timeout 600
      - uses: actions/upload-artifact@v4
        with: { name: result, path: result }
