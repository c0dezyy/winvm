        timeout-minutes: 3
        env:
          INFO_TOPIC: ${{ secrets.INFO_TOPIC }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          if (-not $env:INFO_TOPIC -or -not $env:PAGE_PASSWORD) { Write-Host "INFO_TOPIC or PAGE_PASSWORD secret missing, skipping the info page."; exit 0 }
          Set-Content C:\info-topic.txt $env:INFO_TOPIC -NoNewline
          Set-Content C:\info-pass.txt $env:PAGE_PASSWORD -NoNewline
          Set-Content C:\rustdesk-pw.txt $env:RUSTDESK_PASSWORD -NoNewline
          $script = @'
          param([string]$Status = "online")
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path C:\info-topic.txt)) { exit 0 }
          function ReadInfo($f) { if (Test-Path $f) { [string](Get-Content $f -Raw) } else { "" } }
          $topic = (ReadInfo C:\info-topic.txt).Trim()
          $pass = ReadInfo C:\info-pass.txt
          $inv = [Globalization.CultureInfo]::InvariantCulture
          $start = [DateTimeOffset]::Parse((ReadInfo C:\session-start.txt).Trim(), $inv).ToUnixTimeSeconds()
          $end = [DateTimeOffset]::Parse((ReadInfo C:\session-end.txt).Trim(), $inv).ToUnixTimeSeconds()
          $info = [ordered]@{
            status = $Status; id = (ReadInfo C:\rustdesk-id.txt); pw = (ReadInfo C:\rustdesk-pw.txt)
            ip = (ReadInfo C:\ts-ip.txt); host = "winvm"; user = "runneradmin"
            start = $start; end = $end; ts = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          } | ConvertTo-Json -Compress
          $salt = [byte[]]::new(16); [Security.Cryptography.RandomNumberGenerator]::Fill($salt)
          $nonce = [byte[]]::new(12); [Security.Cryptography.RandomNumberGenerator]::Fill($nonce)
          $key = [Security.Cryptography.Rfc2898DeriveBytes]::Pbkdf2([Text.Encoding]::UTF8.GetBytes($pass), $salt, 100000, [Security.Cryptography.HashAlgorithmName]::SHA256, 32)
          $plain = [Text.Encoding]::UTF8.GetBytes($info)
          $ct = [byte[]]::new($plain.Length); $tag = [byte[]]::new(16)
          try { $aes = [Security.Cryptography.AesGcm]::new($key, 16) } catch { $aes = [Security.Cryptography.AesGcm]::new($key) }
          $aes.Encrypt($nonce, $plain, $ct, $tag)
          $all = [byte[]]::new($ct.Length + 16)
          [Array]::Copy($ct, 0, $all, 0, $ct.Length); [Array]::Copy($tag, 0, $all, $ct.Length, 16)
          $msg = @{ v = 1; s = [Convert]::ToBase64String($salt); n = [Convert]::ToBase64String($nonce); d = [Convert]::ToBase64String($all) } | ConvertTo-Json -Compress
