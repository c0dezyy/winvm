name: Windows VM (Remote Desktop, persistent)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How long each session lives (max 5.5)"
        default: "5"
      auto_restart:
        description: "Start the next session before this one ends (true/false)"
        default: "true"
      save_every:
        description: "Minutes between saves (10 or more)"
        default: "10"
      overlap:
        description: "Minutes before the end to start the next session"
        default: "6"

permissions:
  contents: read
  actions: write   # needed to clean old caches and start the next run

jobs:
  vm:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # 1) Remote Desktop + password
      - name: Enable RDP and set password
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Set-LocalUser -Name runneradmin -Password (ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force)
          Set-Service TermService -StartupType Automatic
          Start-Service TermService

      # 2) RESTORE saved state from the previous session (worlds, settings, logins)
      - name: Restore saved state
        id: restore
        uses: actions/cache/restore@v4
        with:
          key: vm-state-none
          restore-keys: |
            vm-state-
          path: |
            C:\Users\runneradmin\AppData\Roaming\.minecraft
            C:\Users\runneradmin\AppData\Roaming\.tlauncher
            C:\Users\runneradmin\AppData\Roaming\TikTok LIVE Studio
            C:\Users\runneradmin\AppData\Local\TikTok LIVE Studio
            C:\Users\runneradmin\AppData\Local\Roblox
            C:\Users\runneradmin\Desktop
            C:\Users\runneradmin\Documents
            C:\TLauncher
            C:\Users\runneradmin\AppData\Roaming\Mozilla\Firefox
            C:\Users\runneradmin\AppData\Roaming\RustDesk
            C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk
            C:\Apps
            C:\Users\runneradmin\Downloads
            C:\Users\runneradmin\AppData\Local\Programs
            C:\Users\runneradmin\AppData\Roaming\Microsoft\Windows\Start Menu\Programs
            C:\Users\Public\Desktop
            C:\Persist

      - name: Check saved state was found
        shell: pwsh
        continue-on-error: true
        run: |
          $hit = "${{ steps.restore.outputs.cache-matched-key }}"
          if ($hit) {
            Write-Host "Saved state restored from: $hit"
          } else {
            Write-Host "::warning title=No saved state restored::Nothing was restored. Normal on the very first run. If you expected saved data, the newest saves are listed below."
            gh cache list -R ${{ github.repository }} --key vm-state- --limit 5
          }

      # 2b) Put apps you installed last time back into Program Files
      - name: Restore installed apps
        shell: pwsh
        continue-on-error: true
        run: |
          Remove-Item "C:\Users\runneradmin\Desktop\STOP.txt","C:\Users\runneradmin\Desktop\SHUTDOWN.txt","C:\stop.flag","C:\shutdown.flag","C:\restart-now.flag" -Force -ErrorAction SilentlyContinue
          foreach ($m in @(@("PF","C:\Program Files"), @("PF86","C:\Program Files (x86)"))) {
            $src = "C:\Persist\$($m[0])"
            if (-not (Test-Path $src)) { continue }
            Get-ChildItem $src -Directory | ForEach-Object {
              Write-Host "Restoring app folder: $($_.Name)"
              robocopy $_.FullName (Join-Path $m[1] $_.Name) /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
            }
          }
          exit 0

      # 2c) Make Firefox resume your last tabs and logins automatically, every session
      - name: Set up Firefox persistence
        shell: pwsh
        continue-on-error: true
        run: |
          $iniPath = "C:\Users\runneradmin\AppData\Roaming\Mozilla\Firefox\profiles.ini"
          if (-not (Test-Path $iniPath)) { Write-Host "No Firefox profile yet (first run, or nothing restored)."; exit 0 }
          $profiles = Select-String -Path $iniPath -Pattern '^Path=(.+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          foreach ($rel in $profiles) {
            $dir = if ($rel -match '^Profiles/') { "C:\Users\runneradmin\AppData\Roaming\Mozilla\Firefox\$rel" } else { "C:\Users\runneradmin\AppData\Roaming\Mozilla\Firefox\Profiles\$rel" }
            if (-not (Test-Path $dir)) { continue }
            $userJs = Join-Path $dir "user.js"
            @'
          // Written every session: always reopen exactly the tabs you had open, with no "restore session?" prompt.
          user_pref("browser.startup.page", 3);
          user_pref("browser.sessionstore.resume_from_crash", true);
          user_pref("browser.sessionstore.max_resumed_crashes", -1);
          '@ | Set-Content -Path $userJs
            Write-Host "Tab restore enabled for profile: $dir"
          }

      # 3) Apps
      - name: Install apps
        shell: pwsh
        env:
          TIKTOK_STUDIO_URL: ${{ vars.TIKTOK_STUDIO_URL }}
        run: |
          $desktop = "C:\Users\Public\Desktop"
          $startup = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          New-Item -ItemType Directory -Force -Path C:\TLauncher | Out-Null

          # TLauncher jar: only download if not restored from the saved state
          try {
            if (-not (Test-Path "C:\TLauncher\TLauncher.jar")) {
              Invoke-WebRequest -Uri "https://tlauncher.org/jar" -OutFile "C:\TLauncher\TLauncher.jar" -UseBasicParsing
            }
            $java = (Get-Command javaw.exe).Source
            foreach ($dir in @($desktop, $startup)) {
              $sh = (New-Object -ComObject WScript.Shell).CreateShortcut("$dir\TLauncher.lnk")
              $sh.TargetPath = $java
              $sh.Arguments = '-jar "C:\TLauncher\TLauncher.jar"'
              $sh.WorkingDirectory = "C:\TLauncher"
              $sh.Save()
            }
          } catch { Write-Host "TLauncher setup failed: $_" }

          # TikTok LIVE Studio: apps are not saved, only their data/login. Set TIKTOK_STUDIO_URL to reinstall automatically.
          if ($env:TIKTOK_STUDIO_URL) {
            Invoke-WebRequest -Uri $env:TIKTOK_STUDIO_URL -OutFile "C:\tiktok-studio-setup.exe" -UseBasicParsing
            Start-Process "C:\tiktok-studio-setup.exe" -ArgumentList "/S" -Wait
          } else {
            $sh = (New-Object -ComObject WScript.Shell).CreateShortcut("$desktop\TikTok LIVE Studio download.url")
            $sh.TargetPath = "https://www.tiktok.com/live/studio"
            $sh.Save()
          }

      # 3a) Auto-reinstall your own apps every session (edit Documents\apps.txt inside the VM)
      - name: Reinstall my apps
        shell: pwsh
        timeout-minutes: 20
        continue-on-error: true
        run: |
          $list = "C:\Users\runneradmin\Documents\apps.txt"
          if (-not (Test-Path $list)) {
            Set-Content $list "# One Chocolatey package name per line, e.g. obs-studio or vlc. They reinstall automatically every session."
            exit 0
          }
          foreach ($line in Get-Content $list) {
            $n = $line.Trim()
            if (-not $n -or $n.StartsWith("#")) { continue }
            Write-Host "Installing $n"
            choco install $n -y --no-progress
          }

      # 3b) Software OpenGL (Mesa) so Minecraft runs without a video card
      - name: Install Mesa software OpenGL
        shell: pwsh
        continue-on-error: true
        run: |
          $mesaDir = $null
          $7z = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $7z)) { choco install 7zip -y --no-progress | Out-Null }
          # Mesa 26.2.6 MSVC no longer ships the OpenGL files, so try known-good versions in order
          foreach ($v in "23.3.1", "26.2.0") {
            if ($mesaDir) { break }
            try {
              Write-Host "Trying Mesa $v"
              Remove-Item C:\mesa -Recurse -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$v/mesa3d-$v-release-msvc.7z" -OutFile C:\mesa.7z -UseBasicParsing
              Write-Host "Downloaded: $([math]::Round((Get-Item C:\mesa.7z).Length / 1MB, 1)) MB"
              & $7z x C:\mesa.7z -oC:\mesa -y | Out-Null
              Write-Host "7z exit code: $LASTEXITCODE"
              $gl = Get-ChildItem C:\mesa -Recurse -Filter libgallium_wgl.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
              if (-not $gl) { $gl = Get-ChildItem C:\mesa -Recurse -Filter opengl32.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 }
              if ($gl) {
                $mesaDir = $gl.DirectoryName
                Set-Content C:\mesa-dir.txt $mesaDir
                Write-Host "Mesa $v folder: $mesaDir"
                Write-Host ("Files: " + ((Get-ChildItem $mesaDir -Filter *.dll | ForEach-Object { $_.Name }) -join ", "))
              } else {
                Write-Host "Mesa $v has no OpenGL driver files, trying next"
              }
            } catch { Write-Host "Mesa $v failed: $_" }
          }
          if (-not $mesaDir) {
            Write-Host "::error title=Mesa::No Mesa OpenGL files found in any version tried."
          }

          # System-wide: replace the Windows opengl32.dll with Mesa's, so Minecraft works whatever Java it uses
          if ($mesaDir) {
            try {
              $sys = "C:\Windows\System32"
              takeown /f "$sys\opengl32.dll" | Out-Null
              icacls "$sys\opengl32.dll" /grant "Administrators:F" | Out-Null
              if (-not (Test-Path "$sys\opengl32.orig.dll")) { Rename-Item "$sys\opengl32.dll" "opengl32.orig.dll" }
              foreach ($n in "opengl32.dll","libgallium_wgl.dll","libglapi.dll","dxil.dll") {
                if (Test-Path "$mesaDir\$n") { Copy-Item "$mesaDir\$n" $sys -Force }
              }
              Write-Host "System-wide Mesa installed: $(Test-Path "$sys\libgallium_wgl.dll")"
            } catch { Write-Host "System-wide Mesa failed: $_" }
          }

          # helper that drops the Mesa DLLs next to every Java used by Minecraft (re-run while the VM is alive)
          $script = @'
          $src = Get-Content C:\mesa-dir.txt -ErrorAction SilentlyContinue
          if (-not $src -or -not (Test-Path $src)) { exit }
          $names = "opengl32.dll","libgallium_wgl.dll","libglapi.dll","dxil.dll"
          $roots = "C:\Users\runneradmin\AppData\Roaming\.minecraft\runtime","C:\Users\runneradmin\AppData\Roaming\.tlauncher","C:\Program Files\Java","C:\TLauncher","C:\Program Files\Eclipse Adoptium","C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk"
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { continue }
            Get-ChildItem $r -Recurse -Include javaw.exe,java.exe -ErrorAction SilentlyContinue | ForEach-Object {
              $d = $_.DirectoryName
              if (-not (Test-Path "$d\opengl32.dll")) {
                foreach ($n in $names) { if (Test-Path "$src\$n") { Copy-Item "$src\$n" $d -Force -ErrorAction SilentlyContinue } }
                Add-Content C:\mesa-copy.log "$(Get-Date) copied Mesa to $d"
              }
            }
          }
          '@
          Set-Content -Path C:\mesa-copy.ps1 -Value $script
          & C:\mesa-copy.ps1

      # 3c) Keep the desktop session alive when you disconnect (fixes RustDesk "no display")
      - name: Keep session alive
        shell: pwsh
        run: |
          $ts = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item $ts -Force | Out-Null
          Set-ItemProperty $ts -Name MaxDisconnectionTime -Value 0 -Type DWord
          Set-ItemProperty $ts -Name MaxIdleTime -Value 0 -Type DWord
          $keep = @'
          while ($true) {
            foreach ($l in (query session 2>$null)) {
              if ($l -match 'runneradmin\s+(\d+)\s+Disc') { & tscon $Matches[1] /dest:console }
            }
            Start-Sleep 5
          }
          '@
          Set-Content -Path C:\keep-session.ps1 -Value $keep
          schtasks /create /tn KeepSession /tr "powershell -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:\keep-session.ps1" /sc onstart /ru SYSTEM /f | Out-Null
          schtasks /run /tn KeepSession | Out-Null

      # 3b2) Screen size first, so RustDesk starts after the final resolution (avoids flicker and white strips)
      - name: Set screen size
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name LogPixels -Value 96 -Type DWord
            Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name Win8DpiScaling -Value 1 -Type DWord
          } catch { Write-Host "Scaling not set: $_" }
          # calmer desktop for remote viewing: no transparency or window animations (these cause flicker over remote capture)
          foreach ($item in @(
            @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', 'EnableTransparency', 0),
            @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects', 'VisualFXSetting', 2)
          )) {
            try {
              if (-not (Test-Path $item[0])) { New-Item -Path $item[0] -Force | Out-Null }
              Set-ItemProperty -Path $item[0] -Name $item[1] -Value $item[2] -Type DWord
            } catch { Write-Host "Visual setting $($item[1]) not changed: $_" }
          }
          try { Set-ItemProperty 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name MinAnimate -Value "0" } catch {}
          $code = @'
          using System;
          using System.Runtime.InteropServices;
          public class Disp {
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] public static extern bool EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int f);
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;
              public int dmFields;
              public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation; public int dmDisplayFixedOutput;
              public short dmColor; public short dmDuplex; public short dmYResolution; public short dmTTOption; public short dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight;
              public int dmDisplayFlags; public int dmDisplayFrequency;
              public int dmICMMethod; public int dmICMIntent; public int dmMediaType; public int dmDitherType;
              public int dmReserved1; public int dmReserved2; public int dmPanningWidth; public int dmPanningHeight;
            }
          }
          '@
          Add-Type -TypeDefinition $code
          $dm = New-Object Disp+DEVMODE
          $dm.dmSize = [Runtime.InteropServices.Marshal]::SizeOf($dm)
          if ([Disp]::EnumDisplaySettings($null, -1, [ref]$dm)) {
            Write-Host "Current screen: $($dm.dmPelsWidth)x$($dm.dmPelsHeight)"
            foreach ($res in @(@(1920,1080), @(1600,900), @(1366,768))) {
              $dm.dmPelsWidth = $res[0]; $dm.dmPelsHeight = $res[1]; $dm.dmFields = 0x180000
              $r = [Disp]::ChangeDisplaySettings([ref]$dm, 1)
              Write-Host "Tried $($res[0])x$($res[1]) -> code $r (0 = success)"
              if ($r -eq 0) { break }
            }
          } else { Write-Host "Could not read the display settings." }

      # 3c2) Sound: the runner has no sound card, so add a virtual one (VB-CABLE) before RustDesk starts
      - name: Set up sound
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 8
        run: |
          foreach ($svc in "AudioEndpointBuilder", "Audiosrv") {
            try { Set-Service $svc -StartupType Automatic; Start-Service $svc; Write-Host "$svc running" } catch { Write-Host "Service ${svc}: $_" }
          }
          $zip = "C:\vbcable.zip"; $got = $false
          foreach ($pack in "VBCABLE_Driver_Pack45.zip", "VBCABLE_Driver_Pack43.zip") {
            try {
              Invoke-WebRequest "https://download.vb-audio.com/Download_CABLE/$pack" -OutFile $zip -UseBasicParsing
              Write-Host "Downloaded $pack"; $got = $true; break
            } catch { Write-Host "$pack failed: $_" }
          }
          if (-not $got) { Write-Host "::error title=Sound::Could not download VB-CABLE"; exit 1 }
          Expand-Archive $zip C:\vbcable -Force
          # trust the driver publisher so Windows does not stop to ask
          Get-ChildItem C:\vbcable -Recurse -Include *.cat, *.sys | ForEach-Object {
            $c = (Get-AuthenticodeSignature $_.FullName).SignerCertificate
            if ($c) {
              $f = "C:\vbcable-$($c.Thumbprint).cer"
              [IO.File]::WriteAllBytes($f, $c.Export("Cert"))
              certutil -addstore TrustedPublisher $f | Out-Null
            }
          }
          $setup = Get-ChildItem C:\vbcable -Recurse -Filter VBCABLE_Setup_x64.exe | Select-Object -First 1
          # no -Wait: the installer can linger, so wait with a limit instead
          $p = Start-Process $setup.FullName -ArgumentList "-i", "-h", "-H", "-n" -WorkingDirectory $setup.DirectoryName -PassThru
          $p | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { $p | Stop-Process -Force -ErrorAction SilentlyContinue }
          Start-Sleep 8
          Restart-Service Audiosrv -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          # make the virtual card the default speaker (best effort)
          try {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
            Install-Module AudioDeviceCmdlets -Force -Scope CurrentUser -AllowClobber
            Import-Module AudioDeviceCmdlets
            $d = Get-AudioDevice -List | Where-Object { $_.Type -eq "Playback" -and $_.Name -like "CABLE Input*" } | Select-Object -First 1
            if ($d) { Set-AudioDevice -ID $d.ID | Out-Null; Write-Host "Default sound output: $($d.Name)" }
          } catch { Write-Host "Could not set the default device: $_" }
          Write-Host ("Sound devices: " + ((Get-PnpDevice -Class AudioEndpoint -ErrorAction SilentlyContinue | ForEach-Object { $_.FriendlyName }) -join ", "))

      # 3d) RustDesk: connect anytime with an ID + password (same ID every session)
      - name: Install RustDesk
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          if (-not $env:RUSTDESK_PASSWORD) { Write-Host "No RUSTDESK_PASSWORD secret, skipping RustDesk."; exit 0 }
          $h = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $rel = Invoke-RestMethod "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" -Headers $h
          $asset = $rel.assets | Where-Object { $_.name -match '^rustdesk-[\d\.]+-x86_64\.exe$' } | Select-Object -First 1
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile C:\rustdesk-setup.exe -UseBasicParsing
          $rd = "C:\Program Files\RustDesk\rustdesk.exe"

          # Never use Start-Process -Wait here: RustDesk keeps child processes running and the step would hang forever
          $p = Start-Process C:\rustdesk-setup.exe -ArgumentList "--silent-install" -PassThru
          for ($i = 0; $i -lt 30 -and -not (Test-Path $rd); $i++) { Start-Sleep 3 }
          Start-Sleep 10
          Write-Host "RustDesk installed: $(Test-Path $rd)"
          if (-not (Test-Path $rd)) { Write-Host "::error title=RustDesk::Install failed"; exit 1 }

          if (-not (Get-Service RustDesk -ErrorAction SilentlyContinue)) {
            Start-Process $rd -ArgumentList "--install-service" | Out-Null
            Start-Sleep 15
          }
          Start-Service RustDesk -ErrorAction SilentlyContinue

          $p = Start-Process $rd -ArgumentList "--password", $env:RUSTDESK_PASSWORD -PassThru
          $p | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { $p | Stop-Process -Force -ErrorAction SilentlyContinue }
          Write-Host "Password set"

          $id = ""
          for ($i = 0; $i -lt 5 -and -not $id; $i++) {
            $job = Start-Job -ScriptBlock { param($r) cmd /c "`"$r`" --get-id | more" } -ArgumentList $rd
            if (Wait-Job $job -Timeout 20) { $id = (Receive-Job $job | Out-String).Trim() }
            Stop-Job $job -ErrorAction SilentlyContinue
            Remove-Job $job -Force -ErrorAction SilentlyContinue
            if (-not $id) { Start-Sleep 3 }
          }
          if (-not $id) {
            foreach ($f in "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk.toml", "$env:APPDATA\RustDesk\config\RustDesk.toml") {
              if (Test-Path $f) {
                $m = Select-String -Path $f -Pattern "^id\s*=\s*'?(\d+)'?"
                if ($m) { $id = $m.Matches[0].Groups[1].Value; break }
              }
            }
          }
          if (-not $id) {
            Write-Host "::error title=RustDesk::Could not read the RustDesk ID."
            exit 1
          }
          Write-Host "RUSTDESK ID: $id"
          Set-Content C:\rustdesk-id.txt $id -NoNewline
          Write-Host "::notice title=RustDesk::ID: $id  |  Password: your RUSTDESK_PASSWORD"
          Add-Content $env:GITHUB_STEP_SUMMARY "## RustDesk`n- **ID:** ``$id```n- **Password:** the RUSTDESK_PASSWORD secret"

      # 4) Remote access through Tailscale (free, no card needed)
      - name: Start Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if (-not $env:TS_AUTHKEY) {
            Write-Host "::error title=Missing secret::Add the TAILSCALE_AUTHKEY secret."
            exit 1
          }
          New-NetFirewallRule -DisplayName "RDP-3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow | Out-Null
          choco install tailscale -y --no-progress
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts up --authkey=$env:TS_AUTHKEY --hostname=winvm --unattended
          $ip = $null
          for ($i = 0; $i -lt 30 -and -not $ip; $i++) {
            Start-Sleep 2
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
          }
          if (-not $ip) {
            Write-Host "::error title=Tailscale failed::No Tailscale IP. Check that TAILSCALE_AUTHKEY is a valid, unexpired key."
            exit 1
          }
          Write-Host "RDP ADDRESS: $ip"
          Set-Content C:\ts-ip.txt $ip -NoNewline
          Write-Host "::notice title=Remote Desktop::Address: $ip (or winvm)  |  User: runneradmin  |  Password: your RDP_PASSWORD"
          $msg = @"
          ## Remote Desktop details
          - **Address:** ``$ip`` (or ``winvm``)
          - **Username:** ``runneradmin``
          - **Password:** the RDP_PASSWORD secret you set
          Your device must be logged into the same Tailscale account.
          "@
          Add-Content $env:GITHUB_STEP_SUMMARY $msg

      # 5) Optional proxy
      - name: Apply proxy (optional)
        shell: pwsh
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if (-not $env:PROXY_URL) { Write-Host "No PROXY_URL set, skipping."; exit 0 }
          $u = [uri]$env:PROXY_URL
          $hostPort = "$($u.Host):$($u.Port)"
          # IMPORTANT: a system-wide proxy also captures the GitHub Actions runner's own traffic.
          # If the proxy is slow, down, or blocks a site the runner needs, GitHub sees that as
          # "lost communication with the server" and kills the whole run - exactly the failure this
          # fixes. The bypass list below excludes GitHub's and Azure Pipelines' own endpoints so the
          # runner always reaches them directly, never through the proxy.
          $bypass = "*.actions.githubusercontent.com;*.github.com;*.githubusercontent.com;*.pkg.github.com;" +
                    "*.blob.core.windows.net;*.vstsagentpackage.azureedge.net;*.dc.services.visualstudio.com;" +
                    "login.microsoftonline.com;<local>"
          $reg = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          Set-ItemProperty $reg -Name ProxyEnable -Value 1
          Set-ItemProperty $reg -Name ProxyServer -Value $hostPort
          Set-ItemProperty $reg -Name ProxyOverride -Value $bypass
          netsh winhttp set proxy proxy-server="$hostPort" bypass-list="$bypass" | Out-Null
          $opts = "-Dhttp.proxyHost=$($u.Host) -Dhttp.proxyPort=$($u.Port) -Dhttps.proxyHost=$($u.Host) -Dhttps.proxyPort=$($u.Port)"
          [Environment]::SetEnvironmentVariable("JAVA_TOOL_OPTIONS", $opts, "Machine")
          Write-Host "Proxy applied for apps, with GitHub/Azure endpoints excluded so the runner stays reachable."

      # 5b) Remember what is installed now, and plan the session times
      - name: Take app baseline
        shell: pwsh
        run: |
