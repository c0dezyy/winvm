      - name: Handoff - start next session
        if: steps.h.outputs.do == 'true'
        shell: pwsh
        run: |
          gh workflow run windows-vm.yml -R ${{ github.repository }} -f hours=${{ github.event.inputs.hours || '5' }} -f auto_restart=true -f save_every=${{ github.event.inputs.save_every || '10' }} -f overlap=${{ github.event.inputs.overlap || '6' }}
          Write-Host "Next session started. Connect to it when it is up; this one ends soon and will not save again."

      - name: Handoff - stay up until the end
        if: steps.h.outputs.do == 'true'
        shell: pwsh
        run: |
          $inv = [Globalization.CultureInfo]::InvariantCulture
          $end = [datetime]::Parse((Get-Content C:\session-end.txt), $inv)
          if (Test-Path C:\restart-now.flag) {
            $short = (Get-Date).AddMinutes([int]"${{ github.event.inputs.overlap || '6' }}")
            if ($short -lt $end) { $end = $short }
          }
          while ((Get-Date) -lt $end) {
            try { & C:\mesa-copy.ps1 } catch {}
            Start-Sleep -Seconds 15
          }

      # 8) FINAL SAVE (also runs when you cancel). Skipped after a handoff: the next session owns the state.
      - name: Close apps so files are flushed
        if: always()
        shell: pwsh
        run: |
          function Close-BrowsersGracefully {
            $procs = Get-Process firefox, chrome, msedge -ErrorAction SilentlyContinue
            if (-not $procs) { return }
            foreach ($p in $procs) { try { $p.CloseMainWindow() | Out-Null } catch {} }
            $deadline = (Get-Date).AddSeconds(15)
            while ((Get-Date) -lt $deadline) {
              $left = Get-Process firefox, chrome, msedge -ErrorAction SilentlyContinue
              if (-not $left) { break }
              Start-Sleep -Milliseconds 500
            }
            Get-Process firefox, chrome, msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Close-BrowsersGracefully
          Get-Process javaw, java, "TikTok LIVE Studio*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 3

      - name: Publish offline status
        if: always() && steps.h.outputs.do != 'true'
        shell: pwsh
        continue-on-error: true
        run: 'if (Test-Path C:\publish-info.ps1) { & C:\publish-info.ps1 offline }'

      - name: Final - collect apps
        if: always() && steps.h.outputs.do != 'true'
        shell: pwsh
        continue-on-error: true
        run: '& C:\sync-out.ps1'

      - name: Final - save state
        if: always() && steps.h.outputs.do != 'true'
        uses: actions/cache/save@v4
        with:
          key: vm-state-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: |
            C:\Users\runneradmin\AppData\Roaming\.minecraft
            C:\Users\runneradmin\AppData\Roaming\.tlauncher
            C:\Users\runneradmin\AppData\Roaming\TikTok LIVE Studio
            C:\Users\runneradmin\AppData\Local\TikTok LIVE Studio
            C:\Users\runneradmin\AppData\Local\Roblox
            C:\Users\runneradmin\Desktop
            C:\Users\runneradmin\Documents
            C:\TLauncher
            C:\Users\runneradmin\AppData\Roaming\Mozilla\Firefox
            C:\Users\runneradmin\AppData\Roaming\RustDesk
            C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk
            C:\Apps
            C:\Users\runneradmin\Downloads
            C:\Users\runneradmin\AppData\Local\Programs
            C:\Users\runneradmin\AppData\Roaming\Microsoft\Windows\Start Menu\Programs
            C:\Users\Public\Desktop
            C:\Persist

      - name: Final - clean old saves
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ids = gh cache list -R ${{ github.repository }} --key vm-state- --sort created_at --order desc --json id --jq '.[2:][].id'
          foreach ($id in $ids) { gh cache delete $id -R ${{ github.repository }} }
