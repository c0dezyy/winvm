          $hours = [Math]::Min($hoursRequested, 5.3)
          if ($hours -lt $hoursRequested) { Write-Host "hours=$hoursRequested is too close to GitHub's 360-minute hard limit; using $hours instead." }
          $end = (Get-Date).AddHours($hours)
          $overlap = [int]"${{ github.event.inputs.overlap || '6' }}"
          $handoff = $end
          if ("${{ github.event.inputs.auto_restart || 'true' }}" -eq 'true') { $handoff = $end.AddMinutes(-$overlap) }
          Set-Content C:\session-start.txt (Get-Date).ToString("o")
          Set-Content C:\session-end.txt $end.ToString("o")
          Set-Content C:\handoff-time.txt $handoff.ToString("o")
          Write-Host "Session ends: $end | next session starts at: $handoff"
          $sync = @'
          if (-not (Test-Path C:\baseline-pf.txt)) { exit 0 }
          $base = @(Get-Content C:\baseline-pf.txt)
          foreach ($m in @(@("PF","C:\Program Files"), @("PF86","C:\Program Files (x86)"))) {
            $dst = "C:\Persist\$($m[0])"
            New-Item -ItemType Directory -Force $dst | Out-Null
            Get-ChildItem $m[1] -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $target = Join-Path $dst $_.Name
              if (($base -notcontains $_.FullName) -or (Test-Path $target)) {
